[package]
name = "cante-gui"
version = "0.2.3"
edition = "2021"
description = "Cante desktop client"
license = "Apache-2.0"
# 桌面应用这个 crate 现在带三个二进制（窗口本体 + 两个给助手用的表格/PDF 工具）。
# 有多个二进制时，tauri-bundler 必须被明确告知哪个才是应用本体，否则报
# "failed to find main binary" —— 打包会红、而单元测试看不出来。
default-run = "cante-gui"
# The window/plugin/bundle sections are shared; workstream A may add entries to
# [dependencies] but must not change [package], [lib] or [build-dependencies].
[dependencies]
tauri = { version = "2", features = [] }
# Remembers window size/position between runs; needs no JS permission because
# the plugin restores and saves from the Rust side.
tauri-plugin-window-state = "2"
# Simple-mode file pickers and "open / show in folder". Both are driven from
# Rust (`files.rs`), so the webview needs no extra JS package — only the
# capability entries in `capabilities/default.json`.
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# One Cante per computer: a second launch surfaces the open window instead of
# starting a twin that shares the run store and spawns its own daemon.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Spreadsheet read/write for simple mode's flagship job (issue #75). Reading
# uses calamine (xlsx/xls/ods/...), writing uses rust_xlsxwriter; both are pure
# Rust, so the shipped `cante-sheets` helper needs no interpreter or Office.
calamine = "0.36"
rust_xlsxwriter = "0.99"
# PDF read/write for simple mode's #50 jobs (page count, text, merge, split).
# lopdf is pure Rust: no pdfium, no system PDF library, no interpreter — so the
# shipped `cante-pdf` helper works on every machine the app bundles for.
# Default features (chrono/rayon) are off; we only need the core object model.
lopdf = { version = "0.45", default-features = false }

[[bin]]
name = "cante-sheets"
path = "src/bin/cante-sheets.rs"

[[bin]]
name = "cante-pdf"
path = "src/bin/cante-pdf.rs"

# #103 方案 C 的第一段：把 Cante 的 Op/Evt 协议架在 `pi --mode rpc` 前面。
# 它和另外两个 helper 一样不是应用本体（default-run 仍然是 cante-gui）；
# 这一段只做适配器本身，不进安装包（windows 打包不在本段范围）。
[[bin]]
name = "cante-bridge"
path = "src/bin/cante-bridge.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "cante_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 测试里要手写 zip 字节来造「缺 sheet XML」的坏 xlsx（真机 #280 §6 那种）。
# 版本与 calamine 用的对齐（Cargo.lock 里是 8.6.0），避免多拉一份。
[dev-dependencies]
zip = { version = "=8.6.0", default-features = false }
