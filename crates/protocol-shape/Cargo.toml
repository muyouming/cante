[package]
name = "cante-protocol-shape"
version = "0.2.2"
edition = "2024"
rust-version = "1.88"
description = "Protocol schema and wire message shapes for Cante"
license = "Apache-2.0"
repository = "https://github.com/muyouming/cante"
readme = "README.md"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ulid = "3.0"
