name: GUI

on:
  pull_request:
    paths:
      - 'gui/**'
      - '.github/workflows/gui.yml'
  push:
    branches: [main]
    paths:
      - 'gui/**'
      - '.github/workflows/gui.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Frontend and Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install frontend dependencies
        working-directory: gui
        run: bun install --frozen-lockfile
      - name: Run frontend tests
        working-directory: gui
        run: bun test src
      - name: Typecheck frontend
        working-directory: gui
        run: bunx tsc --noEmit

      # Tauri 2 renders in WebKitGTK on Linux, and the webkit2gtk crate links
      # against its C libraries. Without these -dev packages `cargo test`
      # cannot even compile the shell, so install Tauri's documented Linux
      # prerequisites before building anything Rust.
      - name: Install Tauri Linux prerequisites (WebKitGTK dev packages)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
          cache-workspaces: gui/src-tauri -> target

      # No `tauri build` here: bundling needs additional platform tools and is
      # slow. Typecheck, unit tests and `cargo test` are the gate.
      - name: Run Rust tests
        run: cargo test --manifest-path gui/src-tauri/Cargo.toml
