name: GUI

on:
  pull_request:
    paths:
      - 'gui/**'
      - '.github/workflows/gui.yml'
  push:
    branches: [main]
    paths:
      - 'gui/**'
      - '.github/workflows/gui.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: GUI gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      # Tauri 2 renders in WebKitGTK on Linux and the webkit2gtk crate links
      # against its C libraries, so `cargo test` cannot even compile the shell
      # without Tauri's documented Linux prerequisites.
      - name: Install Tauri Linux prerequisites (WebKitGTK dev packages)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          toolchain: stable
          cache-workspaces: gui/src-tauri -> target

      # One command, the same one a developer runs: `gui/scripts/e2e.sh` installs
      # deps, runs the frontend tests and typecheck, builds the web assets (which
      # `tauri::generate_context!` reads at compile time), runs the fixture tests,
      # and finally `cargo test`. Driving CI through the script is deliberate —
      # a hand-written step list drifts from the local gate, which is exactly how
      # a missing `vite build` before `cargo test` slipped through once.
      - name: Run the app's e2e gate
        run: bash gui/scripts/e2e.sh

  windows:
    name: GUI gate (Windows)
    runs-on: windows-latest
    # Git Bash is the shell the app's e2e script is written for; it is present
    # on the Windows images.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          toolchain: stable
          cache-workspaces: gui/src-tauri -> target

      # No WebKitGTK step here: Windows uses WebView2, which the runner already
      # has, and `cargo test` never opens a window. This job is the reason the
      # Rust tests are written portably — the fixture is driven through
      # `CANTE_BIN="bun <script>"` because Windows has no shebang handling.
      - name: Run the app's e2e gate
        run: bash gui/scripts/e2e.sh

      # --- The one thing this job never did: open the window ------------------
      #
      # Everything above compiles and unit-tests on Windows without ever showing
      # a window, and `scripts/dom-smoke.sh` (macOS only) renders the frontend in
      # Chrome. Neither says anything about WebView2, which is the runtime the
      # product actually ships into. These steps build the app without bundling
      # and drive the real window through `tauri-driver` + Edge WebDriver.
      #
      # Deliberately NOT part of `scripts/e2e.sh`: that script is also the local
      # macOS gate, and macOS has no native WebDriver for WKWebView. See
      # gui/e2e-windows/ and the section in gui/README.md.
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      # Edge and the WebView2 runtime are upgraded together with the runner
      # image, so the driver version is resolved at run time: a pinned one stops
      # matching, and the failure mode is a *hung* session rather than an error.
      # The step prints the three versions it saw. `tauri-driver` finds
      # `msedgedriver.exe` through the PATH this step exports.
      - name: Install the matching msedgedriver
        run: bash gui/e2e-windows/install-msedgedriver.sh

      - name: Build the app for the smoke test (debug, no bundle)
        working-directory: gui
        run: bunx tauri build --debug --no-bundle

      - name: UI smoke test (real WebView2 window)
        working-directory: gui
        run: bun run e2e:windows

      # On failure this is the diagnosis: a screenshot, the rendered text and the
      # page HTML, next to the tauri-driver log in the step output.
      - name: Upload the UI smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-ui-smoke
          path: gui/e2e-windows/artifacts/**
          if-no-files-found: ignore
          retention-days: 7
