name: GUI

on:
  pull_request:
    paths:
      - 'gui/**'
      - '.github/workflows/gui.yml'
  push:
    branches: [main]
    paths:
      - 'gui/**'
      - '.github/workflows/gui.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: GUI gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The cheapest gate goes first: this repository is public, and a key or a
      # machine home directory that reaches the history cannot be washed out
      # afterwards. The script only reads `git ls-files`, so it looks at the
      # tracked sources — not the build output — and answers in a few seconds.
      # Same step in both jobs: a secret does not care which OS compiled it.
      - name: Secret scan (keys, private IPs, machine home directories)
        run: bash gui/scripts/secret-scan.sh

      - uses: oven-sh/setup-bun@v2

      # Tauri 2 renders in WebKitGTK on Linux and the webkit2gtk crate links
      # against its C libraries, so `cargo test` cannot even compile the shell
      # without Tauri's documented Linux prerequisites.
      - name: Install Tauri Linux prerequisites (WebKitGTK dev packages)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          toolchain: stable
          cache-workspaces: gui/src-tauri -> target

      # One command, the same one a developer runs: `gui/scripts/e2e.sh` installs
      # deps, runs the frontend tests and typecheck, builds the web assets (which
      # `tauri::generate_context!` reads at compile time), runs the fixture tests,
      # and finally `cargo test`. Driving CI through the script is deliberate —
      # a hand-written step list drifts from the local gate, which is exactly how
      # a missing `vite build` before `cargo test` slipped through once.
      - name: Run the app's e2e gate
        run: bash gui/scripts/e2e.sh

  windows:
    name: GUI gate (Windows)
    runs-on: windows-latest
    # Git Bash is the shell the app's e2e script is written for; it is present
    # on the Windows images.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # Same first gate as the Linux job — see the comment there.
      - name: Secret scan (keys, private IPs, machine home directories)
        run: bash gui/scripts/secret-scan.sh

      - uses: oven-sh/setup-bun@v2
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          toolchain: stable
          cache-workspaces: gui/src-tauri -> target

      # No WebKitGTK step here: Windows uses WebView2, which the runner already
      # has, and `cargo test` never opens a window. This job is the reason the
      # Rust tests are written portably — the fixture is driven through
      # `CANTE_BIN="bun <script>"` because Windows has no shebang handling.
      - name: Run the app's e2e gate
        run: bash gui/scripts/e2e.sh

      # --- The one thing this job never did: open the window ------------------
      #
      # Everything above compiles and unit-tests on Windows without ever showing
      # a window, and `scripts/dom-smoke.sh` (macOS only) renders the frontend in
      # Chrome. Neither says anything about WebView2, which is the runtime the
      # product actually ships into. These steps build the app without bundling
      # and drive the real window through `tauri-driver` + Edge WebDriver.
      #
      # Deliberately NOT part of `scripts/e2e.sh`: that script is also the local
      # macOS gate, and macOS has no native WebDriver for WKWebView. See
      # gui/e2e-windows/ and the section in gui/README.md.
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      # Edge and the WebView2 runtime are upgraded together with the runner
      # image, so the driver version is resolved at run time: a pinned one stops
      # matching, and the failure mode is a *hung* session rather than an error.
      # The step prints the three versions it saw. `tauri-driver` finds
      # `msedgedriver.exe` through the PATH this step exports.
      - name: Install the matching msedgedriver
        run: bash gui/e2e-windows/install-msedgedriver.sh

      # Measured on the three runs before this change: between this step's
      # "Looking up installed tauri packages" line and the build itself the CLI
      # went quiet for 5.1 s, 11.8 s and 21.1 s — it asks cargo for the
      # workspace metadata, and cargo revalidates the crates.io index while it
      # does (the same job's gate step pays 24–28 s for exactly that, against
      # 1.6 s on Linux).
      #
      # Everything this build needs is already in the local cargo cache: `e2e.sh`
      # ran `cargo test` a minute earlier in this same job, and `cargo test`
      # builds every binary (`Running unittests src\main.rs`, `src\bin\*.rs`), so
      # the app binary's dependency set is a subset of what was just resolved and
      # downloaded. Going offline therefore cannot hide a missing crate — it only
      # stops cargo from asking the network what it already knows. If a pull
      # request adds a dependency, the *online* gate step above fetches it first.
      - name: Build the app for the smoke test (debug, no bundle)
        working-directory: gui
        env:
          CARGO_NET_OFFLINE: 'true'
        run: bunx tauri build --debug --no-bundle

      # gsudo is the de-elevation helper the step below needs, and getting it
      # through winget cost 10–17 s on each of the last three runs — almost all of
      # it winget's own start-up and source update, not the 3.4 MB MSI (measured
      # install itself: ~3 s). The binary is the same every time, so this step
      # keeps the copy winget once installed. It is only a cache: on a miss the
      # step below installs through winget exactly as before and re-fills it.
      # Bump the `v1` (or drop the cache) to drop the stored copy.
      - name: Restore the de-elevation helper (gsudo)
        uses: actions/cache@v6
        with:
          path: ~/gsudo-cache
          key: gsudo-cache-v1-${{ runner.os }}

      # De-elevated on purpose. WebView2 runtime 150+ ignores `WEBVIEW2_*`
      # environment variables when the host process runs elevated
      # (MicrosoftEdge/WebView2Feedback#5645), and msedgedriver passes the remote
      # debugging port through exactly that variable. The runner's process *is*
      # elevated, so without this the session dies after 60s with
      # "DevToolsActivePort file doesn't exist" — reproduced here, and documented
      # upstream in tauri-apps/wry#1782, whose maintainers publish this gsudo
      # recipe for GitHub Actions. `icacls` is what lets the medium-integrity
      # process keep reading the workspace and writing the screenshots.
      - name: UI smoke test (real WebView2 window, de-elevated)
        shell: pwsh
        run: |
          icacls "$env:GITHUB_WORKSPACE" /grant "Everyone:(OI)(CI)F" | Out-Null
          $gsudoCache = Join-Path $env:USERPROFILE 'gsudo-cache\gsudo.exe'
          if (Test-Path $gsudoCache) {
            $gsudo = $gsudoCache
            Write-Host "==> gsudo: $gsudo (restored)"
          }
          else {
            winget install --id gerardog.gsudo --exact --accept-source-agreements --accept-package-agreements --disable-interactivity
            # gsudo ships as an MSI, so it is not in this shell's PATH yet; look in
            # the places the installer and winget put it.
            $gsudo = (Get-Command gsudo -ErrorAction SilentlyContinue).Source
            if (-not $gsudo) {
              $gsudo = (Get-ChildItem "$env:ProgramFiles\gsudo", "$env:LOCALAPPDATA\Microsoft\WinGet" -Recurse -Filter gsudo.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
            }
            if (-not $gsudo) { throw "gsudo was not found after winget install" }
            New-Item -ItemType Directory -Force -Path (Split-Path $gsudoCache) | Out-Null
            Copy-Item -LiteralPath $gsudo -Destination $gsudoCache
            Write-Host "==> gsudo: $gsudo (installed, kept for the next run)"
          }
          # Absolute paths: the script finds the binary, the driver and its own
          # artifact folder from its own location, so the cwd can be anything.
          & $gsudo --integrity Medium node "$env:GITHUB_WORKSPACE\gui\e2e-windows\smoke.mjs"
          exit $LASTEXITCODE

      # The diagnosis when something goes wrong: a screenshot, the rendered text
      # and the page HTML, next to the tauri-driver log in the step output.
      # Uploaded on every run on purpose — the screenshots are also how a human
      # sees what the real WebView2 actually painted, on a green run too.
      - name: Upload the UI smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-ui-smoke
          path: gui/e2e-windows/artifacts/**
          if-no-files-found: ignore
          retention-days: 7
