name: Harbor Adapter

on:
  pull_request:
    paths:
      - 'cante-harbor/**'
      - '.github/workflows/harbor-adapter.yml'
  push:
    branches: [main]
    paths:
      - 'cante-harbor/**'
      - '.github/workflows/harbor-adapter.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: '3.12'
          enable-cache: false
      - name: Run unit tests
        run: uv run --no-project python -m unittest discover -s cante-harbor -p 'test_*.py' -v
      - name: Compile adapter modules
        run: uv run --no-project python -m py_compile cante-harbor/cante_agent.py cante-harbor/cante_events.py
